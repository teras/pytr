name: yt-dlp Nightly Update

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Check for new yt-dlp version
        id: check
        run: |
          CURRENT=$(grep -oP 'yt-dlp\[default\]==\K[0-9.]+' web/requirements.txt)
          LATEST=$(curl -s https://pypi.org/pypi/yt-dlp/json | jq -r '.info.version')
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" != "$LATEST" ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
            echo "New yt-dlp available: $CURRENT → $LATEST"
          else
            echo "update=false" >> "$GITHUB_OUTPUT"
            echo "yt-dlp is up to date ($CURRENT)"
          fi

      - name: Update requirements.txt
        if: steps.check.outputs.update == 'true'
        run: |
          sed -i "s/yt-dlp\[default\]==${{ steps.check.outputs.current }}/yt-dlp[default]==${{ steps.check.outputs.latest }}/" web/requirements.txt

      # Dockerfile COPYs APK/IPK — create placeholders since we only care about yt-dlp here
      - name: Create placeholder client packages
        if: steps.check.outputs.update == 'true'
        run: mkdir -p build && touch build/pytr-tv.apk build/pytr-tv.ipk

      - uses: docker/setup-buildx-action@v4
        if: steps.check.outputs.update == 'true'

      # Anonymous pulls from public.ecr.aws get 429s from shared runner IPs;
      # pull the base image from Docker Hub with credentials instead.
      - uses: docker/login-action@v4
        if: steps.check.outputs.update == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        if: steps.check.outputs.update == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: pytr:nightly-test
          build-args: BASE_IMAGE=python:3.12-slim
          cache-from: type=gha,scope=nightly
          cache-to: type=gha,scope=nightly,mode=max

      - name: Smoke test — start server
        if: steps.check.outputs.update == 'true'
        run: |
          mkdir -p data
          docker run -d --name pytr-test -p 8000:8000 -v "$PWD/data:/app/data" pytr:nightly-test
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/profiles/boot > /dev/null 2>&1 && break
            sleep 1
          done

      - name: Install ffmpeg
        if: steps.check.outputs.update == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install browser playback test dependencies
        if: steps.check.outputs.update == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/pytr-smoke-venv"
          "$RUNNER_TEMP/pytr-smoke-venv/bin/pip" install playwright==1.65.2
          "$RUNNER_TEMP/pytr-smoke-venv/bin/playwright" install --with-deps chromium

      - name: Smoke test — verify extraction and play production path
        if: steps.check.outputs.update == 'true'
        timeout-minutes: 10
        run: |
          set -uo pipefail
          VIDEO_ID="dQw4w9WgXcQ"
          BASE="http://localhost:8000"

          # Retry transient extraction and CDN failures; persistent failures
          # still fail the canary and need the diagnostics below to classify.
          retry() {
            local n=1 max=3
            while ! "$@"; do
              [ "$n" -ge "$max" ] && return 1
              echo "   attempt $n failed, retrying in 5s..."
              n=$((n+1)); sleep 5
            done
          }

          # 1. Metadata extraction. This does not verify playable formats and
          #    can also fail because YouTube blocks the runner's IP.
          check_info() {
            local title
            title=$(curl --fail-with-body --silent --show-error --max-time 120 "$BASE/api/info/$VIDEO_ID" | jq -r '.title') || return 1
            [ -n "$title" ] && [ "$title" != "null" ] && echo "   Title: $title"
          }
          echo ":: [1/2] Extraction — /api/info"
          retry check_info || { echo "::error::metadata extraction failed; inspect server logs for the cause"; exit 1; }

          # 2. DASH — use the app's dash.js build in a browser. ffmpeg's DASH
          #    demuxer fails on our WebM SegmentList, which works in dash.js.
          #    Decode 5s, then seek beyond 90s to exercise cap recovery too.
          check_dash() {
            local mpd
            mpd=$(curl --fail-with-body --silent --show-error --max-time 120 "$BASE/api/dash/$VIDEO_ID") || {
              echo "DASH manifest request failed; response body:"
              printf '%s\n' "$mpd"
              return 1
            }
            if ! grep -q "<MPD" <<<"$mpd" ||
               ! grep -q "<Representation" <<<"$mpd" ||
               ! grep -q "/api/videoplayback" <<<"$mpd"; then
              echo "DASH response is missing the expected manifest elements"
              return 1
            fi
            timeout --kill-after=5s 150s "$RUNNER_TEMP/pytr-smoke-venv/bin/python" tests/playback_smoke.py "$BASE" "$VIDEO_ID"
          }
          echo ":: [2/2] DASH playback — /api/dash (production path)"
          retry check_dash || { echo "::error::DASH production path failed"; exit 1; }

          echo "Smoke test passed!"

          # Progressive (22/18) is the last-resort proxy, NOT a gate: YouTube
          # intermittently 403s progressive formats from datacenter IPs, which
          # is environmental, not a yt-dlp regression. HLS is skipped too — a
          # single-audio VOD exposes no HLS manifest via the default client
          # (HLS is only used for multi-audio / live). Both are reported only.
          echo ":: (info) progressive /api/stream-live — non-fatal"
          if timeout --kill-after=5s 30s ffmpeg -nostdin -loglevel error -i "$BASE/api/stream-live/$VIDEO_ID" -t 5 -f null -; then
            echo "   progressive OK"
          else
            echo "::warning::progressive stream-live failed (expected on datacenter IPs; not a regression)"
          fi

      - name: Show server logs on failure
        if: failure() && steps.check.outputs.update == 'true'
        run: docker logs --timestamps pytr-test

      - name: Cleanup test container
        if: always() && steps.check.outputs.update == 'true'
        run: docker rm -f pytr-test 2>/dev/null || true

      # Canary only: a passing run means the new version is safe to ship.
      # Releasing is manual — bump web/requirements.txt on main, which triggers
      # the :latest image build (docker.yml). No auto-commit, no staging branch.
      - name: Report
        if: steps.check.outputs.update == 'true'
        run: echo "::notice::yt-dlp ${{ steps.check.outputs.latest }} passed the smoke test — bump web/requirements.txt on main to release."
